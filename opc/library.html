function card(b){
  const url=(window.BOOKLINK&&BOOKLINK[b[0]])?BOOKLINK[b[0]]:null;
  const link=url?`<a href="${url}">${b[0]}</a>`:b[0];
  const note=url?"":' <span class="muted" style="font-size:12px;">（无全文）</span>';
  const btn=url?`<a class="read-btn" href="${url}">在线阅读 →</a>`:`<span class="read-btn disabled">暂不可读</span>`;
  return `
    <div class="book">
      <h4>${link}${note}</h4>
      <div class="meta">${b[1].map(d=>`<span class="pill" style="font-size:11px;padding:2px 8px;">${DIM[d]}</span>`).join(" ")}</div>
      <div class="frame">${b[2]}</div>
      <div class="book-foot">${btn}</div>
    </div>`;
}
function pagerHtml(totalPages){
  if(totalPages<=1) return "";
  const nums=[];
  const add=n=>{ if(n>=1&&n<=totalPages&&!nums.includes(n)) nums.push(n); };
  add(1); add(totalPages);
  for(let i=page-1;i<=page+1;i++) add(i);
  nums.sort((a,b)=>a-b);
  let html=`<button class="pg" data-pg="${page-1}" ${page<=1?"disabled":""}>‹ 上一页</button>`;
  let prev=null;
  nums.forEach(n=>{
    if(prev!==null&&n-prev>1) html+=`<span class="pg-ell">…</span>`;
    html+=`<button class="pg ${n===page?"on":""}" data-pg="${n}">${n}</button>`;
    prev=n;
  });
  html+=`<button class="pg" data-pg="${page+1}" ${page>=totalPages?"disabled":""}>下一页 ›</button>`;
  return html;
}
function render(){
  const list=BOOKS.filter(b=>cur==="all"||b[1].includes(cur));
  const total=list.length;
  const totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(page>totalPages) page=totalPages;
  const start=(page-1)*PAGE_SIZE;
  document.getElementById("count").textContent=`共 ${total} 本 · 第 ${page}/${totalPages} 页`;
  booksEl.innerHTML=list.slice(start,start+PAGE_SIZE).map(card).join("");
  pagerEl.innerHTML=pagerHtml(totalPages);
  pagerEl.querySelectorAll("button.pg").forEach(btn=>{
    btn.onclick=()=>{
      const p=+btn.dataset.pg;
      if(p>=1&&p<=totalPages){
        page=p; render();
        const y=document.getElementById("books").getBoundingClientRect().top+window.scrollY-90;
        window.scrollTo({top:y,behavior:"smooth"});
      }
    };
  });
}
