const PAGE_SIZE=24;

let cur="all";
let page=1;

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
[["all","全部"],...Object.entries(CATS).map(([k,v])=>[k,v.name])].forEach(([k,t])=>{
  const b=document.createElement("button");
  b.textContent=t;b.className=k===cur?"on":"";
  b.onclick=()=>{
    cur=k;page=1;
    if(k==="all") sampleList=null;
    document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("on"));b.classList.add("on");render();
  };
  filtersEl.appendChild(b);
});
function card(t){
  const [name,cat,url,intro,tags]=t;
  const c=CATS[cat];
  const initial=name.slice(0,1);
  return `<div class="card vc">
    <div class="vc-top">
      <div class="vc-avatar" style="background:${c.c}">${initial}</div>
      <div class="vc-id">
        <h3><a href="${url}" target="_blank" rel="nofollow noopener" style="color:inherit;text-decoration:none;">${name}</a></h3>

      </div>
    </div>

    <div class="vc-foot">
      <span class="vc-tags">${tags.map(x=>`<span class="pill" style="font-size:11px;padding:2px 8px;">${x}</span>`).join(" ")}</span>
      <a class="vc-go" href="${url}" target="_blank" rel="nofollow noopener">查看详情 →</a>
    </div>
  </div>`;
}
function pagerHtml(totalPages){
  if(totalPages<=1) return "";
  const nums=[];
  const add=n=>{ if(n>=1&&n<=totalPages&&!nums.includes(n)) nums.push(n); };
  add(1); add(totalPages);
  for(let i=page-1;i<=page+1;i++) add(i);
  nums.sort((a,b)=>a-b);
  let html=`<button class="pg" data-pg="${page-1}" ${page<=1?"disabled":""}>‹ 上一页</button>`;
  let prev=null;
  nums.forEach(n=>{
    if(prev!==null&&n-prev>1) html+=`<span class="pg-ell">…</span>`;
    html+=`<button class="pg ${n===page?"on":""}" data-pg="${n}">${n}</button>`;
    prev=n;
  });
  html+=`<button class="pg" data-pg="${page+1}" ${page>=totalPages?"disabled":""}>下一页 ›</button>`;
  return html;
}
function wirePager(totalPages){
  pagerEl.querySelectorAll("button.pg").forEach(btn=>{
    btn.onclick=()=>{
      const p=+btn.dataset.pg;
      if(p>=1&&p<=totalPages){
        page=p; render();
        const y=document.getElementById("skillsGrid").getBoundingClientRect().top+window.scrollY-90;
        window.scrollTo({top:y,behavior:"smooth"});
      }
    };
  });
}
function render(){
  let list, totalPages, total;
  if(cur==="all"){
    if(!sampleList) sampleList=shuffle(SKILLS).slice(0,SAMPLE);
    list=sampleList;
    total=SKILLS.length;
    totalPages=1;
    document.getElementById("count").textContent=`为你随机推荐 ${list.length} 个技能（全部 ${total} 个 · 点“换一批”换一组）`;
    shuffleWrap.style.display="block";
    shuffleWrap.innerHTML=`<button class="btn-shuffle" id="shuffleBtn">🔀 换一批</button>`;
    document.getElementById("shuffleBtn").onclick=()=>{
      sampleList=null; render();
      const y=document.getElementById("skillsGrid").getBoundingClientRect().top+window.scrollY-90;
      window.scrollTo({top:y,behavior:"smooth"});
    };
  } else {
    sampleList=null;
    const full=SKILLS.filter(t=>t[1]===cur);
    total=full.length;
    totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE));
    if(page>totalPages) page=totalPages;
    const start=(page-1)*PAGE_SIZE;
    list=full.slice(start,start+PAGE_SIZE);
    document.getElementById("count").textContent=`共 ${total} 个技能 · 第 ${page}/${totalPages} 页`;
    shuffleWrap.style.display="none";
    shuffleWrap.innerHTML="";
  }
  gridEl.innerHTML=list.map(card).join("");
  pagerEl.innerHTML=(cur==="all")?"":pagerHtml(totalPages);
  if(cur!=="all") wirePager(totalPages);
}
render();
</script>
</body>
</html>
