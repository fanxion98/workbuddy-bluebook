<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面不存在 | 思谋轩</title>
<link rel="stylesheet" href="/opc/assets/css/style.css">
</head>
<body>
<div id="site-nav"></div>
<div id="app" style="min-height:60vh;"></div>
<div id="site-footer"></div>
<script src="/opc/assets/js/site.js?v=6"></script>
<script>
(function(){
  var app = document.getElementById('app');

  // 检测是否是 OPC 社区详情页路径: /opc/opc/xxx.html
  var m = location.pathname.match(/\/opc\/opc\/([a-z0-9_-]+)\.html/i);
  if (!m) {
    // 不是OPC详情页路径，显示通用404
    app.innerHTML = '<header class="pagehead"><div class="wrap"><h1>页面不存在</h1><p class="lead">你访问的页面找不到。</p><p style="margin-top:20px;"><a href="/" style="color:var(--color-primary-600);">← 返回首页</a> &nbsp; <a href="/opc/">超级OPC一人公司秘籍</a></p></div></header>';
    return;
  }

  // 是OPC详情页，加载 _opc.js 数据并渲染
  var slug = m[1];
  var script = document.createElement('script');
  script.src = '/opc/opc/_opc.js?v=20260806';
  script.onload = function(){
    var DATA = window.OPCS || [];
    var d = null;
    for (var i=0; i<DATA.length; i++) { if (DATA[i].slug === slug) { d = DATA[i]; break; } }
    if (!d) {
      app.innerHTML = '<header class="pagehead"><div class="wrap"><h1>社区未找到</h1><p class="lead">未找到该OPC社区。<a href="/opc/opc.html">查看全部社区</a>。</p></div></header>';
      return;
    }

    function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

    // 把来源里的域名/url转成可点击链接（如 OPC圈(opcquan.com) -> OPC圈(<a>opcquan.com</a>)）
    function linkifySrc(s){
      var raw = String(s==null?"":s);
      var escaped = esc(raw);
      // 1) 括号里的域名：(xxx.com / xxx.cn / xxx.org ...)
      escaped = escaped.replace(/\(([a-z0-9][a-z0-9.-]*\.[a-z]{2,}[^)]*)\)/gi,
        function(m,dom){return '(<a href="https://'+dom+'" target="_blank" rel="noopener" class="src-link">'+dom+'</a>)';});
      // 2) 独立的 URL：http(s)://...
      escaped = escaped.replace(/(?<!["\(\/>])(https?:\/\/[^\s<]+)/g,
        '<a href="$1" target="_blank" rel="noopener" class="src-link">$1</a>');
      return escaped;
    }

    document.title = esc(d.name) + ' | 全国OPC社区 | 超级OPC一人公司秘籍';
    var focusPills = (d.focus||[]).map(function(f){return '<span class="pill">'+esc(f)+'</span>';}).join('');
    var wechatPills = (d.wechat||[]).map(function(w){return '<span class="pill accent">'+esc(w)+'</span>';}).join('');
    var cover = d.image ? '<img src="'+esc(d.image)+'" alt="'+esc(d.name)+'" style="width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin-bottom:24px;" onerror="this.style.display=\'none\'">' : '';

    app.innerHTML = '<header class="pagehead"><div class="wrap">' +
      '<div class="crumb"><a href="/opc/index.html">首页</a> / <a href="/opc/opc.html">全国OPC社区</a> / ' + esc(d.name) + '</div>' +
      '<h1>' + esc(d.name) + '</h1>' +
      '<div class="pillrow" style="margin-top:14px;">' +
        '<span class="pill accent">' + esc(d.city) + '</span>' +
        '<span class="pill">' + esc(d.gov_level) + '</span>' +
        wechatPills +
      '</div></div></header>' +
      '<section class="section"><div class="wrap" style="max-width:760px;">' +
      cover +
      '<p class="lead" style="font-size:18px;line-height:1.8;color:var(--ink);margin-bottom:28px;">' + esc(d.summary) + '</p>' +
      '<div style="display:grid;grid-template-columns:1fr;gap:20px;">' +
      '<div style="padding:20px;border:1px solid var(--line);border-radius:8px;"><h3 style="font-family:var(--serif);font-size:18px;margin:0 0 10px;">运营方</h3><p style="color:var(--ink);margin:0;font-size:15px;line-height:1.7;">' + esc(d.operator) + '</p></div>' +
      '<div style="padding:20px;border:1px solid var(--line);border-radius:8px;"><h3 style="font-family:var(--serif);font-size:18px;margin:0 0 10px;">政府级别</h3><p style="color:var(--ink);margin:0;font-size:15px;">' + esc(d.gov_level) + '</p></div>' +
      '<div style="padding:20px;border:1px solid var(--line);border-radius:8px;"><h3 style="font-family:var(--serif);font-size:18px;margin:0 0 10px;">成立时间</h3><p style="color:var(--ink);margin:0;font-size:15px;">' + esc(d.founded) + '</p></div>' +
      '<div style="padding:20px;border:1px solid var(--line);border-radius:8px;"><h3 style="font-family:var(--serif);font-size:18px;margin:0 0 10px;">赛道方向</h3><div class="pillrow" style="margin-top:6px;">' + focusPills + '</div></div>' +
      '<div style="padding:20px;border:1px solid var(--line);border-radius:8px;"><h3 style="font-family:var(--serif);font-size:18px;margin:0 0 10px;">微信公众号</h3><div class="pillrow" style="margin-top:6px;">' + (wechatPills || '<span class="muted">暂未收录</span>') + '</div></div>' +
      '<div style="padding:20px;border:1px solid var(--line);border-radius:8px;"><h3 style="font-family:var(--serif);font-size:18px;margin:0 0 10px;">信息来源</h3><p style="color:var(--muted);margin:0;font-size:14px;">' + linkifySrc(d.src) + '</p></div>' +
      '</div>' +
      '<div style="margin-top:36px;text-align:center;"><a href="/opc/opc.html" style="display:inline-block;padding:12px 28px;border:2px solid var(--ink);border-radius:2px;color:var(--ink);text-decoration:none;font-family:var(--serif);font-size:16px;">← 返回全国OPC社区列表</a></div>' +
      '</div></section>';
  };
  document.head.appendChild(script);
})();
</script>
</body>
</html>
